apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 1.16.0
    argocd.argoproj.io/instance: grafana
    helm.sh/chart: grafana-0.1.0
  name: grafana-lb
  namespace: grafana
spec:
  ports:
    - name: "http"
      port: 80
      protocol: TCP
      targetPort: 30444
  selector:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/name: grafana
  type: LoadBalancer
